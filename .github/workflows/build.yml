name: Build displayPost
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build client
        run: msbuild displayPost.vcxproj /m /p:Configuration=Release /p:Platform=x64
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item bin/x64/Release/displayPost.exe package/displayPost.exe
          Copy-Item README.md package/README.md
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: displayPost-x64
          path: package
